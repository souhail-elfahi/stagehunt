fit_score:                         # 0-100, see fit_score.py
  skills: 45                       # x share of the offer's skills that are tier 1-2 in profile.md
  roles:                           # Type de poste
    "analyste / études": 20
    "data scientist": 16
    "ingénieur data / IA": 6
    "autre": 8
  place:                           # Lieu
    priority_area: 15              # inside the priority metro area
    priority_region: 10            # elsewhere in the priority region
    regions: {"Île-de-France": 12} # other regions with their own score
    other: 10
  pay:                             # Rémunération, €/month
    legal_min_hourly: 4.50         # French legal minimum gratification, €/h: UPDATE EACH JANUARY
    hours_per_month: 151.67        # 35 h x 52 weeks / 12
    high: 1200                     # >= high: high points
    mid: 900                       # >= mid: mid points; above the legal minimum: low points
    points: {high: 10, mid: 6, low: 3, unknown: 2, legal_minimum: 0}
  freshness:                       # Fraîcheur: [max age in days, points]; older = 0
    steps: [[1, 10], [3, 6], [7, 3]]
    unknown: 3                     # no publication date
  short_internship:                # under min_months: minus penalty
    min_months: 4
    penalty: 15

runs:
  min_interval_minutes: 175        # never scrape more often than every 3h (small margin)
  follow_up_days: 7                # Postulé for this many days or more: follow-up due
  schedule:                        # the Windows scheduled task (setup /setup shows the command)
    start: "08:00"
    every_hours: 3
    for_hours: 14                  # 08:00, 11:00, 14:00, 17:00, 20:00

goals:                             # dashboard defaults; once set in the sheet, the sheet wins
  daily: 3
  weekly: 15
