# My settings for internship-hunter. Generic, commented version: config.example.yaml.
# Everything specific to one person lives here; the code has no personal values.

timezone: Europe/Paris

search:
  country: France                  # Indeed's country site
  terms:                           # "stage " is added in front when a term doesn't contain it
    - data analyst
    - data scientist
    - stage data
    - stage chargé d'études statistiques
    - stage économétrie
    - stage statisticien
  narrow_terms:                    # rarer wording: fewer LinkedIn results, no priority-area search
    - stage chargé d'études statistiques
    - stage économétrie
    - stage statisticien
  indeed_results: 100              # one Indeed request returns up to 100 offers
  pause_seconds: 3                 # between two requests
  # Location -> LinkedIn results per term. One LinkedIn request = 10 results.
  # Requests per run = sum over searches of (1 Indeed + ceil(LinkedIn / 10)).
  cli:                             # python find_internships.py: 24 requests per window
    locations: {"France": 20, "Lille, France": 20}
    narrow_locations: {"France": 10}
  full_scan:                       # first run of the day, 7-day window: 39 requests
    hours: 168
    locations: {"France": 60, "Lille, France": 20}
    narrow_locations: {"France": 20}
  quick_scan:                      # every other run, 24h window: 18 requests
    hours: 24
    locations: {"France": 10, "Lille, France": 10}
    narrow_locations: {"France": 10}
  watch_cap: "Lille, France"       # quick-scan searches that hit their cap here are reported
  linkedin_descriptions: 20        # LinkedIn description fetches per run (new offers only)

priority:                          # where I want to work (no move)
  name: Lille                      # the metro area; a location starting with it counts as inside
  region: Hauts-de-France          # shown first in the digest (🏠), in the cockpit and a filter view
  towns:                           # towns of the metro area (accents, case and hyphens don't matter)
